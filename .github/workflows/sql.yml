name: SQL checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify.py

  mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['8.0', '8.4']
    services:
      mysql:
        image: mysql:${{ matrix.version }}
        env:
          MYSQL_ROOT_PASSWORD: root-tests
          MYSQL_DATABASE: hackerrank_test
          MYSQL_USER: hackerrank
          MYSQL_PASSWORD: local-tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot-tests"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_DATABASE: hackerrank_test
      MYSQL_USER: hackerrank
      MYSQL_PASSWORD: local-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python tools/verify.py --dialect mysql
